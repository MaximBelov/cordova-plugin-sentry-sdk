name: Android tests
# The Kotlin of src/android on the JVM with Robolectric, against cordova-android's framework and sentry-android, and the device
# tests of tests/ on an Android emulator, where the plugin is installed into an app the way an app installs it, and the demo app
# that crashes itself on an emulator and sends its report to an endpoint on the runner (test/e2e). Linux with KVM.
# Called by ci.yaml when something it covers changes, and for every push to main.
on:
  workflow_call:
jobs:
  # No emulator: the plugin's Kotlin built against cordova-android's framework, the SDK started against a DSN that reaches nothing.
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: npm run test:android:coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-android
          path: test/android/plugin/build/reports/coverage/test/debug
          if-no-files-found: ignore
  paramedic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # An emulator needs hardware acceleration, which the runner allows to everyone once /dev/kvm is open.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          script: ANDROID_SERIAL=emulator-5554 npm run test:paramedic:android
  # The plugin's whole path: the demo app, with the plugin installed the way an app installs it, starts the SDK against a DSN that
  # points at an ingest endpoint on this runner, sets a user, tags and a context, and crashes; the next launch sends the report, and
  # the test reads it. No Sentry account and no secret, so it runs for every pull request, a fork's and Dependabot's too.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: npm ci
      # Built before the emulator starts, so the emulator is not held while Gradle downloads. One name for the run, in the build and in
      # the test: the demo reports it as its release.
      - name: Build the demo app
        run: npm run test:e2e:android:build -- --run ${{ github.run_id }}-${{ github.run_attempt }}
      - name: The manifest allows the plain http the endpoint speaks
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$aapt2" dump xmltree demo/platforms/android/app/build/outputs/apk/debug/app-debug.apk --file AndroidManifest.xml | grep -i usesCleartextTraffic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          script: ANDROID_SERIAL=emulator-5554 npm run test:e2e:android -- --run ${{ github.run_id }}-${{ github.run_attempt }}
