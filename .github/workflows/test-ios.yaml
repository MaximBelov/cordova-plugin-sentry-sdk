name: iOS tests
# The Swift, the device tests and the demo app that crashes itself, all on an iOS simulator: no phone, and no system prompt to answer.
# The jobs are independent and run side by side. Called by ci.yaml when something they cover changes, and for every push to main.
on:
  workflow_call:
# macos-26, not macos-15: the default Xcode on macos-15 is 16.4 (Swift 6.1), and SwiftPM 6.1 refuses sentry-cocoa 9.x pinned by
# version, because the manifest it reads for that toolchain (Package@swift-6.1.swift) depends on KSCrash by revision, a dependency
# it never uses: "'sentry-cocoa' is required using a stable-version but 'sentry-cocoa' depends on an unstable-version package
# 'kscrash'" (run 38413045350). SwiftPM 6.2 (Xcode 26) leaves the unused dependency out and resolves. Xcode 26 is what an app
# needs too, and the README says so.
jobs:
  # The Swift of src/ios against cordova-ios and sentry-cocoa, with XCTest.
  xctest:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:ios:coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-ios
          path: coverage/ios.json
          if-no-files-found: ignore
      # A cancelled run leaves xcodebuild and the simulator running, which slows the runner's own clean-up for minutes.
      - name: Stop what the tests left running
        if: always()
        run: |
          pkill -f '[x]codebuild' || true
          xcrun simctl shutdown all || true
  # tests/ (the device tests) in an app on the simulator, with the plugin installed the way an app installs it.
  paramedic:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # cordova-paramedic checks the requirements of a device build first, and refuses to start without ios-deploy
      # even though a simulator run does not use it.
      - run: brew install ios-deploy
      - run: npm run test:paramedic:ios:simulator
      - name: Stop what the tests left running
        if: always()
        run: |
          pkill -f '[c]ordova-paramedic' || true
          pkill -f '[x]codebuild' || true
          xcrun simctl shutdown all || true
  # The plugin's whole path on iOS: the demo app, with the plugin installed the way an app installs it, runs on a simulator, sets a user
  # and a context, starts the SDK against a DSN that points at an ingest endpoint on this runner, sets tags and crashes; the next launch
  # sends the report, and the test reads it. A simulator shares the runner's network, so nothing has to be forwarded. No Sentry account
  # and no secret, so it runs for every pull request, a fork's and Dependabot's too.
  e2e:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # One name for the run, in the build and in the test: the demo reports it as its release.
      - name: Build the demo app for a simulator
        run: npm run test:e2e:ios:build -- --run ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Crash it and read what it sends
        run: npm run test:e2e:ios -- --run ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stop what the test left running
        if: always()
        run: |
          pkill -f '[x]codebuild' || true
          xcrun simctl shutdown all || true
