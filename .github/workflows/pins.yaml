name: SDK pins
# The two native SDKs are pinned in this repository (Package.swift and plugin.xml), and Dependabot cannot move either pin: its Swift jobs
# failed on the local path to cordova-ios in test/ios, and plugin.xml is not a manifest it reads. So this looks every Monday, and on
# demand, at the latest release of each SDK, and opens a pull request that moves the pin when it is behind, a major release included:
# the pull request is what shows what a major breaks. scripts/check-pins.mjs does the looking and the opening.
#
# Two things have to hold for it to work:
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests" is on. Without it GitHub refuses the pull
#     request, and the run fails at `gh pr create` with the branch already pushed.
#   - CI is started by the script itself, as a workflow_dispatch of ci.yaml on the branch, because the pull_request run of a pull request
#     that a workflow opened is held until someone approves it. The dispatched run is associated with the pull request (`pull_requests`
#     of the run) and the description links it, but the list of checks on the pull request showed only the held run's, which has none
#     (#18, the first one this opened).
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write # the branch
  pull-requests: write # the pull request
  actions: write # CI on the branch
jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node scripts/check-pins.mjs --pr
        env:
          GH_TOKEN: ${{ github.token }}
