name: Publish

# Publishes cordova-plugin-sentry-sdk to npm on a push to main, when the version in package.json is not
# published yet; a push that keeps the version publishes nothing, so a release is a version bump merged to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: The committed build is the build of the source
        run: git diff --exit-code -- www types
      - name: Publish a version that is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published: nothing to do"
          else
            npm publish --access public
          fi
