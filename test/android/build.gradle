// The plugin's Kotlin (src/android of the repository) built against cordova-android's framework and sentry-android, and tested on the
// JVM with Robolectric: no emulator, no network. `npm run test:android` runs it.
plugins {
    // The build tools and the Kotlin plugin are the ones cordova-android's own release ships with (test/unit/toolchain.test.mjs reads
    // them from node_modules): an app that enables Kotlin gets that version unless it sets another, and the plugin is tested the way
    // an app builds it. A newer Android Gradle plugin is not a better test, it is another build: AGP 9 refuses the Kotlin plugin
    // outright.
    id 'com.android.library' version '8.10.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.21' apply false
}
