plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace = 'io.github.maximbelov.sentry.test'
    compileSdk = 36
    defaultConfig {
        minSdk = 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        // The sources the plugin ships, not a copy of them.
        main.kotlin.srcDirs = ['../../../src/android']
    }
    buildTypes {
        debug {
            // the coverage of the unit tests: createDebugUnitTestCoverageReport
            enableUnitTestCoverage = true
        }
    }
    testOptions {
        targetSdk = 36
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric loads the classes under test through its own class loader
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }
}
dependencies {
    // the same versions plugin.xml declares for an app, and the artifact an app gets unless it asks for the NDK
    implementation 'org.apache.cordova:framework:15.1.0'
    implementation 'io.sentry:sentry-android-core:8.60.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
}
